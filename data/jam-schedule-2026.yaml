        Brooks Lybrand is the developer relations manager for Remix at Shopify. He works across education, community, product, and open source to help developers build better web applications—and to help the Remix team learn from the people using it.

- time: "2:30 PM"
  title: "Beyond the Server: Frames, SPAs, and Testing in Remix"
  description: |-
    By the time an application returns a response, Remix has already handled routing, middleware, rendering, and data—but a full-stack framework shouldn’t stop at the server boundary.


    Remix extends up into the browser, where frames provide incremental navigation and granular updates to route-owned regions, while the SPA package runs Remix routes entirely on the client. It also extends out into the test runner, with tools for testing routes directly, exercising components in real browsers, and verifying complete end-to-end flows.


    In this talk, we’ll explore how these pieces fit together and how Remix carries a consistent, web-standard programming model across server, browser, and test environments.
  speakers:
    - name: Matt Brophy
      imgFilename: matt-brophy.webp
      bio: >-
        Matt Brophy is a staff developer at Shopify working on Remix and React Router. He enjoys working at the intersection of routing, data loading, and framework architecture (a.k.a., the “back end of the front end.") and making complex web application behavior easier to reason about.

