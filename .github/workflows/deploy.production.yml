name: 🚀 Deploy (production)
on:
  push:
    branches:
      - main
    paths-ignore:
      - ".vscode/**"
      - "scripts/**"
      - "README.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  test:
    name: ⚡ Remix Test
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v5

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile

      - name: 🎭 Install Playwright browsers
        run: pnpm run test:install-browsers

      - name: ⚡ Run Remix tests
        run: pnpm run test:ci
        env:
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: 🚀 Deploy Production
        if: ${{ github.ref == 'refs/heads/main' }}
        run: flyctl deploy --remote-only --config ./fly.production.toml --strategy rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  purge:
    name: 🧹 Purge CDN
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: 🧹 Purge documents and public files
        run: |
          # A second key purge closes Fastly's edge/shield propagation race.
          for attempt in 1 2; do
            for key in documents static-assets; do
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Accept: application/json" \
                --header "Fastly-Key: ${{ secrets.FASTLY_API_TOKEN }}" \
                "https://api.fastly.com/service/${{ secrets.FASTLY_SERVICE_ID }}/purge/$key"
            done

            if [ "$attempt" -eq 1 ]; then
              sleep 2
            fi
          done
