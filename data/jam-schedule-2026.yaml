- time: "1:30 PM"
  title: Remix Unbundled
  description: |-
    What if you could skip the bundler build step and start your production server immediately? Remix ships with an asset server designed for production use, where TypeScript, JSX, CSS and static files compile when requested, without sacrificing the developer experience we've come to expect from modern tooling. In this talk we'll explore how the Remix philosophy changes the way we think about bundling, and why we think it's time to give "unbundling" a try.
  speakers:
    - name: Mark Dalgleish
      imgFilename: mark-dalgleish.webp
      bio: >-
        Mark Dalgleish is a staff developer at Shopify working on Remix. He is a co-creator of CSS Modules and Vanilla Extract, and has spent his career improving the way developers build and ship web interfaces.

- time: "2:00 PM"
  title: What do Agents Think of Remix?
  description: >-
    When we first announced the direction we were taking Remix, we shared [a few principles](https://remix.run/blog/wake-up-remix#principles). The first (and most controversial at the time) was “Model-First Development.” The premise was that Remix should be easy not only for people to understand, but also for large language models to generate, navigate, and modify.


    More than a year later, we’ve used coding agents across a wide range of Remix projects: building the Remix Store, migrating remix.run from React, creating demos and proofs of concept, publishing newsletter archives, and finally rebuilding the Store with Remix 3. Along the way, we’ve learned what makes Remix especially usable for agents, where they get stuck, and where our patterns and abstractions either help or get in the way.


    This talk traces that feedback loop: how Brooks works with coding agents, what those agents reveal about Remix (the good, bad, and ugly), and how those lessons are shaping the framework itself.
  speakers:
    - name: Brooks Lybrand
      imgFilename: brooks-lybrand.webp
      bio: >-
        Brooks Lybrand leads developer relations for Remix at Shopify. He works across product, education, open source, and community—helping developers build better web applications and bringing what he learns from them back into Remix.

- time: "2:30 PM"
  title: "Beyond the Server: Frames, SPAs, and Testing in Remix"
  description: |-
    By the time an application returns a response, Remix has already handled routing, middleware, rendering, and data—but a full-stack framework shouldn’t stop at the server boundary.


    Remix extends _up_ into the browser, where frames provide incremental navigation and granular updates to route-owned regions, while the SPA package runs Remix routes entirely on the client. It also extends _out_ into the test runner, with tools for testing routes directly, exercising components in real browsers, and verifying complete end-to-end flows.


    In this talk, we’ll explore how these pieces fit together and how Remix carries a consistent, web-standard programming model across server, browser, and test environments.
  speakers:
    - name: Matt Brophy
      imgFilename: matt-brophy.webp
      bio: >-
        Matt Brophy is a staff developer at Shopify working on Remix and React Router. He enjoys working at the intersection of routing, data loading, and framework architecture (a.k.a., the “back end of the front end.") and making complex web application behavior easier to reason about.

