- time: "10:30 AM"
  title: Remix Philosophy
  description: >-
    Remix has always been guided by a few durable ideas: lean on the web, keep the mental model simple, and make full-stack development feel direct and fun.


    Michael will share the principles behind Remix 3, how those principles shaped a ground-up redesign, and what they mean for the way we build software for the web.
  speakers:
    - name: Michael Jackson
      imgFilename: michael.webp
      bio: >-
        Michael Jackson is a prolific contributor to open source. He is the co-author of Remix and [React Router](https://reactrouter.com), and the creator of [unpkg.com](https://unpkg.com). He enjoys system design, front-end architecture, and playing guitar. Michael lives in Carlsbad, California with his wife and four children.

- time: "11:30 AM"
  title: Remix Q&A
  description: >-
    Michael Jackson and Brooks Lybrand open the floor for questions about the ideas behind Remix 3, the decisions that shaped it, and what developers can build with it.


    Bring the questions you have after the opening talk—or the ones you've been waiting to ask the Remix team directly.
  speakers:
    - name: Michael Jackson
      imgFilename: michael.webp
      bio: >-
        Michael Jackson is the co-author of Remix and React Router and the creator of unpkg.com.
    - name: Brooks Lybrand
      imgFilename: brooks-lybrand.webp
      bio: >-
        Brooks Lybrand leads developer relations for Remix at Shopify, where he helps developers understand and get the most out of the framework.

- time: "12:00 PM"
  title: Lunch
  description: >-
    Take a break and enjoy lunch with fellow attendees. This is a great time to discuss the morning sessions and meet more of the Remix community.
  speakers:
    - name: "🥪"
