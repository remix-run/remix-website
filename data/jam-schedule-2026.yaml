- time: "1:30 PM"
  title: Remix Unbundled
  description: |-
    What if you could skip the bundler build step and start your production server immediately? Remix ships with an asset server designed for production use, where TypeScript, JSX, CSS and static files compile when requested, without sacrificing the developer experience we've come to expect from modern tooling. In this talk we'll explore how the Remix philosophy changes the way we think about bundling, and why we think it's time to give "unbundling" a try.
  speakers:
    - name: Mark Dalgleish
      imgFilename: mark-dalgleish.webp
      bio: >-
        Mark Dalgleish is a staff developer at Shopify working on Remix. He is a co-creator of CSS Modules and Vanilla Extract, and has spent his career improving the way developers build and ship web interfaces.

