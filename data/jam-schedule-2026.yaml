- time: "3:30 PM"
  title: The Remix Way
  description: |-
    What happens when you take the ideas behind Remix and apply them to everything you build?


    After months of building real apps with Remix 3, Sergio ended up growing an entire stack around it, from i18n and background jobs to email, MCP, and UI components. In this talk, Sergio will share how that happened, why so much of it starts with the Web Platform, and what he's learned about building the Remix way.
  speakers:
    - name: Sergio Xalambrí
      imgFilename: sergio-xalambri.webp
      bio: >-
        Sergio Xalambrí is an Argentinian web developer with more than a decade of experience. He works at [Daffy](https://www.daffy.org/) and maintains open-source libraries around React Router, Remix, and OAuth 2.0. He enjoys building full-stack applications, designing libraries, and exploring the Web Platform.

- time: "4:00 PM"
  title: What should the browser actually own?
  description: Every Shopify Edition asks the browser to do more. This is the story of how we started asking it to do less.
  speakers:
    - name: Josh Sanger
      imgFilename: josh-sanger.webp
      bio: >-
        Josh Sanger is a senior engineer at Shopify who builds ambitious web projects like Shopify Editions and explores the boundaries between browser capabilities, application architecture, and delightful experiences.

