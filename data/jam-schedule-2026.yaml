- time: "10:30 AM"
  title: Remix 3
  description: In a world where agents write most of the code, we should expect a whole lot more from a web framework. That's the idea behind Remix 3. We set out to make every piece faster, smaller, and easier to use, from the server to the browser. It's built for you and your agents, and you can use as much or as little of it as you want. In this talk Michael will show you what we've been working on and where we're going from here.
  speakers:
    - name: Michael Jackson
      imgFilename: michael.webp
      bio: >-
        Michael Jackson is a prolific contributor to open source.

