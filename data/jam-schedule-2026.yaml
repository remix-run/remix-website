- time: "1:30 PM"
  title: Remix Unbundled
  description: >-
    Remix 3 is more than a framework-shaped package. Its focused modules are designed to stand on their own, work together, and let you choose the parts your application actually needs.


    Mark will unpack this modular architecture, show how the pieces fit together, and explore what becomes possible when a full-stack framework is built without treating the bundle as the boundary.
  speakers:
    - name: Mark Dalgleish
      imgFilename: mark-dalgleish.webp
      bio: >-
        Mark Dalgleish is a staff developer at Shopify working on Remix. He is a co-creator of CSS Modules and the creator of [vanilla-extract](https://vanilla-extract.style/), and has spent his career improving the way developers build and ship web interfaces.

- time: "2:00 PM"
  title: Agentic Remix
  description: >-
    Software agents are changing how applications are designed, built, and maintained. A framework for this new workflow needs to be understandable by people, legible to agents, and composed from tools that work across the network boundary.


    Brooks will explore how Remix 3's direct architecture supports agent-assisted development and what we've learned while building Remix with agents in the loop.
  speakers:
    - name: Brooks Lybrand
      imgFilename: brooks-lybrand.webp
      bio: >-
        Brooks Lybrand is the developer relations manager for Remix at Shopify. He works across education, community, product, and open source to help developers build better web applications—and to help the Remix team learn from the people using it.

- time: "2:30 PM"
  title: "Full-stack JavaScript, Actually: From Testing to Single Page Apps"
  description: >-
    “Full stack” should mean more than sharing a language between two disconnected halves of an application. The same web primitives should carry an idea from a test, through the server, and into an interactive browser experience.


    Matt will trace that path through Remix 3, showing how its modules compose across environments and how the architecture scales from focused tests all the way to single-page applications.
  speakers:
    - name: Matt Brophy
      imgFilename: matt-brophy.webp
      bio: >-
        Matt Brophy is a staff developer at Shopify and a core contributor to Remix and React Router. He focuses on routing, data loading, framework architecture, and making complex web application behavior easier to reason about.

