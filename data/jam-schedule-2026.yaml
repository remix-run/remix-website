- time: "4:00 PM"
  title: What Should the Browser Actually Own?
  description: >-
    Modern applications can put nearly anything in the browser—but capability isn't the same as responsibility. Where should state live? Which interactions belong on the client? When should the server stay in control?


    Josh will examine the browser/server boundary and offer a practical way to decide what the browser should own, what it should borrow, and what it should leave behind.
  speakers:
    - name: Josh Sanger
      imgFilename: josh-sanger.webp
      bio: >-
        Josh Sanger is a developer at Shopify who builds ambitious web experiences and explores the boundaries between browser capabilities, application architecture, and product design.

